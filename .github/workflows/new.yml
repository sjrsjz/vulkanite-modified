name: Build and Publish Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:  # Возможность запуска вручную

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout upstream Iris
        uses: actions/checkout@v4
        with:
          repository: IrisShaders/Iris
          ref: 8ebd1c2ba245cd4a20577f2a6eef83e3fae87a1e
          path: iris

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build upstream Iris
        working-directory: iris
        run: bash ./gradlew :fabric:jar --configure-on-demand --no-daemon

      - name: Build with Gradle
        run: ./gradlew build --no-daemon -PirisJar="iris/build/libs/iris-fabric-1.12.1-snapshot+mc26.3-build.${GITHUB_RUN_NUMBER}.jar"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-artifacts
          path: build/libs/

      - name: Publish to GitHub Packages
        if: github.event_name == 'release'
        run: ./gradlew publish --no-daemon -PirisJar="iris/build/libs/iris-fabric-1.12.1-snapshot+mc26.3-build.${GITHUB_RUN_NUMBER}.jar"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.actor }}
