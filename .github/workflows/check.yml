name: Check Build
on:
  pull_request:
    branches: ['*']
  push:
    branches: ['*']
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IrisShaders/Iris
          ref: 8ebd1c2ba245cd4a20577f2a6eef83e3fae87a1e
          path: iris
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build upstream Iris
        working-directory: iris
        run: bash ./gradlew :fabric:jar --configure-on-demand --no-daemon
      - name: Build Vulkanite
        run: bash ./gradlew build --stacktrace --no-daemon -PirisJar="iris/build/libs/iris-fabric-1.12.1-snapshot+mc26.3-build.${GITHUB_RUN_NUMBER}.jar"
