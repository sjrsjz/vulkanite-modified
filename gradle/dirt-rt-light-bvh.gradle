tasks.register('prepareDirtRtLightBvh') {
    group = 'shaderpacks'
    description = 'Build an isolated Dirt RT copy with terrain area-light sampling'
    doLast {
        def input = providers.gradleProperty('shaderpack').orNull
        if (input == null) throw new GradleException('Supply -Pshaderpack pointing to the Dirt RT directory')
        def source = new File(file(input), 'shaders').canonicalFile
        def destination = layout.buildDirectory.dir('shaderpacks/Dirt RT Light BVH/shaders').get().asFile.canonicalFile
        if (!new File(source, 'lib/rt/raytrace/path_trace.glsl').isFile()) {
            throw new GradleException("Dirt RT shader files not found in ${source}")
        }
        if (destination.toPath().startsWith(source.toPath()) || source.toPath().startsWith(destination.toPath())) {
            throw new GradleException('Choose the original Dirt RT directory as the input')
        }

        def files = [:]
        def read = { name -> files.computeIfAbsent(name) {
            new File(source, name).getText('UTF-8').replace('\r\n', '\n')
        } }
        def edit = { name, anchor, replacement ->
            def original = read(name)
            int at = original.indexOf(anchor)
            if (at < 0 || original.lastIndexOf(anchor) != at) {
                throw new GradleException("Dirt RT integration could not locate a unique anchor in ${name}")
            }
            files[name] = original.substring(0, at) + replacement + original.substring(at + anchor.length())
        }
        def terrainLights = 'lib/rt/vulkanite/terrain_lights.glsl'
        def writePack = {
            files['lib/rt/vulkanite/light_bvh.glsl'] =
                    file('src/main/resources/assets/vulkanite/shaders/include/light_bvh.glsl').getText('UTF-8')
            project.sync { copy ->
                copy.from(source)
                copy.into(destination)
            }
            files.each { name, contents ->
                def target = new File(destination, name)
                target.parentFile.mkdirs()
                target.setText(contents, 'UTF-8')
            }
            logger.lifecycle("Dirt RT Light BVH prepared at ${destination.parentFile}")
        }

        def properties = read('shaders.properties')
        if (new File(source, terrainLights).isFile() &&
                (properties =~ /(?m)^[ \t]*rt\.lightBvh[ \t]*=[ \t]*true\b/).find()) {
            def settings = 'lib/settings.glsl'
            if (new File(source, settings).isFile()) {
                files[settings] = read(settings).replaceFirst(
                        /(?m)^([ \t]*)\/\/[ \t]*(#define[ \t]+TERRAIN_LIGHT_BVH\b)/, '$1$2')
            }
            writePack()
            return
        }

        def scene = 'lib/rt/raytrace/scene.glsl'
        edit(scene, '    bool inverse_0, bool isNEE, bool ignoreTransmissive, float tMin) {',
                '    bool inverse_0, bool isNEE, bool ignoreTransmissive, float tMin, float tMax) {')
        edit(scene, '    float tMax = 2048.0;\n', '')
        def raycast = '''float raycastMin(in vec3 ro, in vec3 rd, out vec3 ro_o, out vec3 rd_o,
    bool inverse_0, bool isNEE, float tMin) {'''
        edit(scene, raycast, '''float raycastMin(in vec3 ro, in vec3 rd, out vec3 ro_o, out vec3 rd_o,
    bool inverse_0, bool isNEE, bool ignoreTransmissive, float tMin) {
    return raycastMin(ro, rd, ro_o, rd_o, inverse_0, isNEE, ignoreTransmissive, tMin, 2048.0);
}

''' + raycast)

        def includes = '#include "/lib/rt/raytrace/scene.glsl"'
        edit('lib/rt/raytrace_rgen.glsl', includes, includes + '''
#if defined(FIRST_LOBE_DIFFUSE)
#include "/lib/rt/vulkanite/terrain_lights.glsl"
#endif''')

        def trace = 'lib/rt/raytrace/path_trace.glsl'
        edit(trace, '    vec3 L_direct_0_incident = vec3(0.0);', '''    vec3 L_direct_0_incident = vec3(0.0);
    #if defined(FIRST_LOBE_DIFFUSE)
    bool vltPrimaryNee = false;
    vec3 vltPrimaryShadingNormal = vec3(0.0, 1.0, 0.0);
    vec3 vltDirect = vec3(0.0);
    vec3 vltDirection = vec3(0.0, 1.0, 0.0);
    #endif''')
        edit(trace, '        fb.rd_o = next_rd;', '''        #if defined(FIRST_LOBE_DIFFUSE)
        vltPrimaryNee = !inside && lobes.P_diff > 1e-8 && vltTerrainLightCount() != 0u;
        #if EON_ENABLED
        vltPrimaryShadingNormal = geometryNormal;
        #else
        vltPrimaryShadingNormal = macroNormal;
        #endif
        if (vltPrimaryNee) {
            vec3 wi, Li;
            float lightPdf;
            if (vltDirtSampleLight(ro_o, geometryNormal, vltPrimaryShadingNormal, wi, Li, lightPdf)) {
                float guidePdf = primaryGuideMixturePdf(diffuseGuide, 1.0 / (2.0 * PI), wi);
                vltDirect = Li * (balanceHeuristic(lightPdf, guidePdf) / lightPdf);
                #if !EON_ENABLED
                vltDirect *= evaluateDisneyDiffuseFactor(-fb.rd_i, wi, macroNormal, surf.R.x) / PI;
                #endif
                vltDirection = wi;
            }
        }
        #endif

        fb.rd_o = next_rd;''')
        edit(trace, '            bounceEmission += throughput * surf.light;', '''            float emissionMis = 1.0;
            #if defined(FIRST_LOBE_DIFFUSE)
            if (depth == 1 && vltPrimaryNee && any(greaterThan(surf.light, vec3(0.0)))) {
                float lightPdf = vltDirtLightPdf(fb.p, ro_o, rd_i, fb.geometry_n,
                    vltPrimaryShadingNormal, tmp_Payload, blockID);
                if (lightPdf > 0.0) emissionMis = balanceHeuristic(lastBsdfStrategyPdf, lightPdf);
            }
            #endif
            bounceEmission += throughput * surf.light * emissionMis;''')
        edit(trace, '        L_direct_0_dir, ro);', '        L_direct_0_dir, vltDirect, vltDirection, ro);')

        def output = 'lib/rt/raytrace/gbuffer_io.glsl'
        edit(output, '    vec3 L_direct_0, vec3 L_direct_0_dir, vec3 ro) {',
                '    vec3 L_direct_0, vec3 L_direct_0_dir, vec3 vltDirect, vec3 vltDirection, vec3 ro) {')
        edit(output, '        combinedMaxEnt = indMaxEnt;', '''        if (!any(isnan(vltDirect)) && !any(isinf(vltDirect))) {
            MaxEntEncoding local = radiance_to_maxent(clamp(vltDirect, 0.0, 32000.0), vltDirection);
            indMaxEnt.CoCg += local.CoCg;
            indMaxEnt.maxEntY += local.maxEntY;
        }
        combinedMaxEnt = indMaxEnt;''')

        files['shaders.properties'] = properties + '\nrt.lightBvh = true\n'
        files[terrainLights] = file('shaderpacks/dirt-rt/terrain_lights.glsl').getText('UTF-8')
        writePack()
    }
}
