plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        url = "https://maven.caffeinemc.net/releases"
        content { includeGroup 'net.caffeinemc' }
    }
    mavenCentral()
}

def irisJar = providers.gradleProperty('irisJar')
        .orElse('../iris/build/libs/iris-fabric-1.12.1-snapshot+mc26.3-local.jar')

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API - use full bundle
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation 'net.caffeinemc:sodium-fabric:0.9.3-beta.5+mc26.3'
    implementation files(irisJar)
}

// Opt-in, isolated end-to-end test mod. It is never included in the release jar.
if (providers.gradleProperty('smokeTest').isPresent()) {
    sourceSets {
        smoke {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods {
            vulkanite { sourceSet sourceSets.main }
            vulkanite_smoke { sourceSet sourceSets.smoke }
        }
        runs {
            smokeClient {
                inherit client
                source sourceSets.smoke
                runDir 'build/smoke-client'
                vmArgs '--enable-native-access=ALL-UNNAMED', '-Dmixin.debug.verify=true'
                if (!providers.gradleProperty('shaderpack').isPresent()) vmArg '-Dvulkanite.smokeProbe=true'
                programArgs '--graphicsBackend', 'vulkan', '--width', '640', '--height', '360', '--username', 'VulkaniteSmoke'
            }
        }
    }
    tasks.register('prepareSmokeClient') {
        doLast {
            def testDir = layout.buildDirectory.dir('smoke-client').get().asFile
            new File(testDir, 'config').mkdirs()
            def selectedPack = providers.gradleProperty('shaderpack')
            def packName = selectedPack.isPresent() ? 'Dirt RT' : 'Vulkanite probe'
            new File(testDir, 'config/iris.properties').text = "enableShaders=true\nshaderPack=${packName}\n"
            new File(testDir, 'options.txt').text = 'renderDistance:4\nsimulationDistance:5\nmaxFps:120\nenableVsync:false\npauseOnLostFocus:false\n'
            new File(testDir, 'smoke-result.txt').delete()
            def packDir = file(selectedPack.getOrElse('src/smoke/shaderpack'))
            if (!new File(packDir, 'shaders').isDirectory()) {
                throw new GradleException("Missing shaderpack shaders directory at ${packDir}")
            }
            project.sync { copy ->
                copy.from new File(packDir, 'shaders')
                copy.into new File(testDir, "shaderpacks/${packName}/shaders")
            }
        }
    }
    tasks.named('runSmokeClient') {
        dependsOn 'prepareSmokeClient'
        def config = layout.buildDirectory.file('smoke-client/launch.cfg').get().asFile
        jvmArgumentProviders.add({ ["-Dfabric.dli.config=${config.absolutePath}".toString()] }
                as CommandLineArgumentProvider)
        doFirst {
            def lines = file('.gradle/loom-cache/launch.cfg').readLines()
            if (providers.gradleProperty('assetsDir').isPresent()) {
                for (int i = 0; i < lines.size() - 1; i++) {
                    if (lines[i].trim() == '--assetsDir') lines[i + 1] = '\t' + providers.gradleProperty('assetsDir').get()
                    if (lines[i].trim() == '--assetIndex' && providers.gradleProperty('assetIndex').isPresent()) {
                        lines[i + 1] = '\t' + providers.gradleProperty('assetIndex').get()
                    }
                }
            }
            config.text = lines.join('\n') + '\n'
        }
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    base.archivesName = project.archives_base_name
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
